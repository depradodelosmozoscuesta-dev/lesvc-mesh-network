plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.lesvc.mesh"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.lesvc.mesh"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "0.3"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.all {
            dependsOn 'buildHostJni'
            systemProperty 'java.library.path', file("$buildDir/host-jni").absolutePath
            systemProperty 'tabla.salida', file("$buildDir/reports/ggwave-roundtrip.md").absolutePath
            systemProperty 'muestras.salida', (System.getenv("LESVC_MUESTRAS") ?: "$buildDir/lesvc-img-samples")
            testLogging {
                events "passed", "failed"
                showStandardStreams = true
                exceptionFormat "full"
            }
        }
    }
}

// Compila ggwave + puente JNI para el ordenador (Linux/macOS) y así los tests
// JVM usan exactamente el mismo código nativo que el APK.
tasks.register('buildHostJni', Exec) {
    inputs.dir("src/main/cpp")
    inputs.file("${rootDir}/tools/build-host-jni.sh")
    outputs.dir("$buildDir/host-jni")
    commandLine 'bash', "${rootDir}/tools/build-host-jni.sh", file("$buildDir/host-jni").absolutePath, android.sdkDirectory.absolutePath,
            System.getProperty("java.home")
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity-ktx:1.8.2"        // selector de fotos (Photo Picker) sin permisos
    implementation "androidx.exifinterface:exifinterface:1.3.7"  // girar las fotos según la cámara
    testImplementation "junit:junit:4.13.2"
}
